name: Deploy .NET 8 Backend to VPS (Stable)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # BUILD
      # =========================
      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      # =========================
      # DEPLOY SAFE (PRESERVA CONFIG VPS)
      # =========================
      - name: Deploy to IIS
        run: |
          $target = "C:\inetpub\wwwroot\MerceriaBack"
          $temp = "C:\inetpub\wwwroot\MerceriaBack_temp"

          # Limpiar temp
          if (Test-Path $temp) {
            Remove-Item $temp -Recurse -Force
          }

          New-Item -ItemType Directory -Path $temp -Force | Out-Null

          # Copiar build nuevo
          Copy-Item "${{ github.workspace }}\publish\*" $temp -Recurse -Force

          # =========================
          # PRESERVAR appsettings.json DEL SERVIDOR
          # =========================
          $serverConfig = "$target\appsettings.json"
          $tempConfig = "$temp\appsettings.json"

          if (Test-Path $serverConfig) {
            Copy-Item $serverConfig $tempConfig -Force
          }

          # =========================
          # SWAP ATÓMICO
          # =========================
          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          Rename-Item $temp "MerceriaBack"
