name: Deploy .NET 8 Backend to VPS (Stable IIS Safe Fix)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      - name: Deploy to IIS (fixed locks)
        run: |
          $source = "${{ github.workspace }}\publish"
          $target = "C:\inetpub\wwwroot\MerceriaBack"

          Import-Module WebAdministration

          # =========================
          # STOP IIS COMPLETO
          # =========================
          Stop-WebAppPool -Name "MerceriaBack" -ErrorAction SilentlyContinue
          Stop-Website -Name "MerceriaBack" -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 10

          # =========================
          # KILL PROCESOS BLOQUEANDO DLLs
          # =========================
          Get-Process w3wp -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3

          # =========================
          # PRESERVAR CONFIG
          # =========================
          $serverConfig = "$target\appsettings.json"
          $localConfig = "$source\appsettings.json"

          if (Test-Path $serverConfig) {
            Copy-Item $serverConfig $localConfig -Force
          }

          # =========================
          # ASEGURAR DESTINO
          # =========================
          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          # =========================
          # DEPLOY
          # =========================
          robocopy $source $target /MIR /R:2 /W:2 /NFL /NDL

          if ($LASTEXITCODE -lt 8) {
            exit 0
          } else {
            exit $LASTEXITCODE
          }

          # =========================
          # START IIS
          # =========================
          Start-WebAppPool -Name "MerceriaBack" -ErrorAction SilentlyContinue
          Start-Website -Name "MerceriaBack" -ErrorAction SilentlyContinue
