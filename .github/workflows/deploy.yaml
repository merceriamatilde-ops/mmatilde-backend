name: Deploy .NET 8 Backend to VPS (Stable IIS Safe)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # BUILD
      # =========================
      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      # =========================
      # DEPLOY SAFE (IIS FRIENDLY)
      # =========================
      - name: Deploy to IIS (robocopy safe)
        run: |
          Import-Module WebAdministration

          $target = "C:\inetpub\wwwroot\MerceriaBack"

          # =========================
          # STOP APP POOL
          # =========================
          Stop-WebAppPool -Name "MerceriaBack" -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          # =========================
          # PRESERVAR appsettings DEL VPS
          # =========================
          $serverConfig = "$target\appsettings.json"
          $tempConfig = "${{ github.workspace }}\publish\appsettings.json"

          if (Test-Path $serverConfig) {
            Copy-Item $serverConfig $tempConfig -Force
          }

          # =========================
          # DEPLOY CON ROBOCOPY (EVITA LOCKS)
          # =========================
          robocopy "${{ github.workspace }}\publish" $target /MIR /R:2 /W:2

          # =========================
          # START APP POOL
          # =========================
          Start-WebAppPool -Name "MerceriaBack" -ErrorAction SilentlyContinue
