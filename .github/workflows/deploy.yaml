name: Deploy .NET 8 Backend to VPS (Production Safe)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ❌ REMOVIDO: setup-dotnet (ya está instalado en el VPS)

      # =========================
      # BUILD
      # =========================
      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      # =========================
      # BACKUP CURRENT VERSION
      # =========================
      - name: Backup current deployment
        run: |
          $target = "C:\inetpub\wwwroot\MerceriaBack"
          $backup = "C:\inetpub\backups\MerceriaBack_$(Get-Date -Format yyyyMMdd_HHmmss)"

          if (!(Test-Path "C:\inetpub\backups")) {
            New-Item -ItemType Directory -Path "C:\inetpub\backups"
          }

          if (Test-Path $target) {
            Copy-Item $target $backup -Recurse -Force
            Write-Host "Backup created at $backup"
          } else {
            Write-Host "No previous deployment found, skipping backup"
          }

      # =========================
      # STOP APP POOL
      # =========================
      - name: Stop IIS App Pool
        run: |
          Import-Module WebAdministration

          $pool = "MerceriaBack"
          $state = Get-WebAppPoolState -Name $pool

          if ($state.Value -eq "Started") {
            Stop-WebAppPool -Name $pool
          }

      # =========================
      # ATOMIC DEPLOY (TEMP SWAP)
      # =========================
      - name: Deploy to IIS (safe swap)
        run: |
          $target = "C:\inetpub\wwwroot\MerceriaBack"
          $temp = "C:\inetpub\wwwroot\MerceriaBack_temp"

          if (Test-Path $temp) {
            Remove-Item $temp -Recurse -Force
          }

          New-Item -ItemType Directory -Path $temp -Force | Out-Null

          Copy-Item "${{ github.workspace }}\publish\*" $temp -Recurse -Force

          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          Rename-Item $temp "MerceriaBack"

      # =========================
      # START APP POOL
      # =========================
      - name: Start IIS App Pool
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "MerceriaBack"
