name: Deploy .NET 8 Backend to VPS (Stable Deploy)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # BUILD
      # =========================
      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      # =========================
      # STOP IIS + FREE LOCKS
      # =========================
      - name: Stop IIS App Pool
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "MerceriaBack" -ErrorAction SilentlyContinue

          # asegurar liberación de locks
          Start-Sleep -Seconds 5
          Get-Process w3wp -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      # =========================
      # DEPLOY (SAFE OVERWRITE - NO SWAP)
      # =========================
      - name: Deploy to IIS
        run: |
          $source = "${{ github.workspace }}\publish"
          $target = "C:\inetpub\wwwroot\MerceriaBack"

          # crear carpeta si no existe
          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          # limpiar contenido sin borrar carpeta (evita locks de rename)
          Get-ChildItem $target -Recurse -Force -ErrorAction SilentlyContinue |
            Remove-Item -Force -Recurse -ErrorAction SilentlyContinue

          # copiar nuevo deploy
          robocopy $source $target /MIR /R:2 /W:2 /XF appsettings.json

      # =========================
      # START IIS
      # =========================
      - name: Start IIS App Pool
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "MerceriaBack"
