name: Deploy .NET 8 Backend to VPS (Stable Swap Deploy)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # BUILD
      # =========================
      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      # =========================
      # STOP IIS (CLAVE)
      # =========================
      - name: Stop IIS App Pool
        run: |
          Import-Module WebAdministration
          Stop-WebAppPool -Name "MerceriaBack" -ErrorAction SilentlyContinue

      # =========================
      # DEPLOY (SAFE SWAP)
      # =========================
      - name: Deploy to IIS (swap strategy)
        run: |
          $source = "${{ github.workspace }}\publish"
          $target = "C:\inetpub\wwwroot\MerceriaBack"
          $temp   = "C:\inetpub\wwwroot\MerceriaBack_new"
          $old    = "C:\inetpub\wwwroot\MerceriaBack_old"

          # =========================
          # LIMPIAR TEMP
          # =========================
          if (Test-Path $temp) {
            Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          }

          New-Item -ItemType Directory -Path $temp -Force | Out-Null

          # =========================
          # COPIAR BUILD
          # =========================
          robocopy $source $temp /MIR /R:2 /W:2 /NFL /NDL /XF appsettings.json

          # =========================
          # SWAP SEGURO
          # =========================
          if (Test-Path $old) {
            Remove-Item $old -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (Test-Path $target) {
            Rename-Item $target "MerceriaBack_old"
          }

          Rename-Item $temp "MerceriaBack"

          # =========================
          # LIMPIEZA POSTERIOR
          # =========================
          Start-Sleep -Seconds 3
          Remove-Item $old -Recurse -Force -ErrorAction SilentlyContinue

      # =========================
      # START IIS
      # =========================
      - name: Start IIS App Pool
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "MerceriaBack"
