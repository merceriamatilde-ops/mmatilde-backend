name: Deploy .NET 8 Backend to VPS (Safe AppSettings Protected)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # BUILD
      # =========================
      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      # =========================
      # DEPLOY (SAFE)
      # =========================
      - name: Deploy to IIS (protected config)
        run: |
          $source = "${{ github.workspace }}\publish"
          $target = "C:\inetpub\wwwroot\MerceriaBack"

          # Crear carpeta destino si no existe
          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          # Deploy excluyendo appsettings.json (NO se pisa nunca)
          robocopy $source $target /MIR /R:2 /W:2 /NFL /NDL /XF appsettings.json

          # Robocopy exit code fix
          if ($LASTEXITCODE -lt 8) {
            exit 0
          } else {
            exit $LASTEXITCODE
          }
