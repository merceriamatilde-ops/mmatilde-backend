name: Deploy .NET 8 Backend to VPS (Stable Swap Deploy)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # BUILD
      # =========================
      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      # =========================
      # DEPLOY (SAFE SWAP)
      # =========================
      - name: Deploy to IIS (swap strategy)
        run: |
          $source = "${{ github.workspace }}\publish"
          $target = "C:\inetpub\wwwroot\MerceriaBack"
          $temp   = "C:\inetpub\wwwroot\MerceriaBack_new"

          # =========================
          # CREAR CARPETA TEMP
          # =========================
          if (Test-Path $temp) {
            Remove-Item $temp -Recurse -Force
          }

          New-Item -ItemType Directory -Path $temp -Force | Out-Null

          # =========================
          # COPIAR BUILD A TEMP (SIN LOCKS)
          # =========================
          robocopy $source $temp /MIR /R:2 /W:2 /NFL /NDL /XF appsettings.json

          # =========================
          # SWAP ATÓMICO
          # =========================
          if (Test-Path $target) {
            Remove-Item $target -Recurse -Force
          }

          Rename-Item $temp "MerceriaBack"

          # =========================
          # FIX EXIT CODE ROBOCOPY
          # =========================
          if ($LASTEXITCODE -lt 8) {
            exit 0
          } else {
            exit $LASTEXITCODE
          }
