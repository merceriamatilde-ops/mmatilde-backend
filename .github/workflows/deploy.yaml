name: Deploy .NET 8 Backend to VPS (Stable Deploy)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # BUILD
      # =========================
      - name: Restore dependencies
        run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

      - name: Publish Application
        run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o "${{ github.workspace }}\publish" --no-restore

      # =========================
      # STOP IIS + FREE LOCKS
      # =========================
      - name: Stop IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          
          # Verificar el estado actual del App Pool para evitar errores si ya está detenido
          $poolState = (Get-WebAppPoolState -Name "MerceriaBack").Value
          Write-Host "El estado actual del App Pool es: $poolState"
          
          if ($poolState -ne "Stopped") {
              Write-Host "Deteniendo el App Pool..."
              Stop-WebAppPool -Name "MerceriaBack"
              Start-Sleep -Seconds 3
          } else {
              Write-Host "El App Pool ya estaba detenido. Continuando..."
          }

          # Asegurar liberación de locks
          Start-Sleep -Seconds 2
          Get-Process w3wp -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      # =========================
      # DEPLOY (SAFE OVERWRITE - NO SWAP)
      # =========================
      - name: Deploy to IIS
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\publish"
          $target = "C:\inetpub\wwwroot\MerceriaBack"

          # crear carpeta si no existe
          if (!(Test-Path $target)) {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          # limpiar contenido sin borrar carpeta (evita locks de rename)
          Get-ChildItem $target -Recurse -Force -ErrorAction SilentlyContinue |
            Remove-Item -Force -Recurse -ErrorAction SilentlyContinue

          # copiar nuevo deploy controlando el exit code de robocopy
          robocopy $source $target /MIR /R:2 /W:2 /XF appsettings.json
          
          # Robocopy exit codes menores a 8 significan éxito (1 = Archivos copiados exitosamente)
          if ($LastExitCode -lt 8) {
              Write-Host "Robocopy finalizó con éxito (Exit Code: $LastExitCode)"
              $global:LASTEXITCODE = 0
          } else {
              Write-Error "Robocopy falló críticamente con Exit Code: $LastExitCode"
              exit $LastExitCode
          }

      # =========================
      # START IIS
      # =========================
      - name: Start IIS App Pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          
          $poolState = (Get-WebAppPoolState -Name "MerceriaBack").Value
          if ($poolState -ne "Started") {
              Write-Host "Iniciando el App Pool..."
              Start-WebAppPool -Name "MerceriaBack"
          } else {
              Write-Host "El App Pool ya está corriendo."
          }
