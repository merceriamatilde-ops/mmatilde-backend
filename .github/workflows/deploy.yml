name: Deploy Backend to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore MMatilde.Api/MMatilde.Api.csproj

    - name: Build and Publish
      run: dotnet publish MMatilde.Api/MMatilde.Api.csproj -c Release -o ./publish /p:UseAppHost=false

    - name: Copy files to VPS via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        source: "./publish/*"
        target: "/var/www/mmatilde-backend"
        strip_components: 1

    - name: Run Database Migrations
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          set -euo pipefail
          CONN=$(python3 -c "import json; print(json.load(open('/etc/mmatilde/appsettings.json'))['ConnectionStrings']['DefaultConnection'])")
          export PATH="$PATH:$HOME/.dotnet/tools"
          if ! command -v dotnet-ef >/dev/null 2>&1; then
            dotnet tool install --global dotnet-ef --version 8.0.0
          fi
          dotnet ef database update \
            --assembly /var/www/mmatilde-backend/MMatilde.Api.dll \
            --startup-assembly /var/www/mmatilde-backend/MMatilde.Api.dll \
            --connection "$CONN"

    # One-time cleanup: only runs when commit message contains [wipe-db]
    - name: Wipe database (one-time cleanup)
      if: contains(github.event.head_commit.message, '[wipe-db]')
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          set -euo pipefail
          CONN=$(python3 -c "import json; print(json.load(open('/etc/mmatilde/appsettings.json'))['ConnectionStrings']['DefaultConnection'])")
          psql "$CONN" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE r RECORD;
          BEGIN
            FOR r IN (
              SELECT tablename FROM pg_tables
              WHERE schemaname = 'public' AND tablename <> '__EFMigrationsHistory'
            ) LOOP
              EXECUTE 'TRUNCATE TABLE ' || quote_ident(r.tablename) || ' RESTART IDENTITY CASCADE';
            END LOOP;
          END $$;
          SQL
          echo "Database wiped (seed runs on API restart)."

    - name: Restart Systemd Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          sudo systemctl restart mmatilde-api.service
